[project]
name = "atlas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.143.3",
    "psycopg[binary]>=3.3.6",
    "sqlmodel>=0.0.48",
    "tzdata>=2026.5",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "diff-cover>=10.6.0",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 88

[tool.mypy]
strict = true
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=atlas --cov-report=xml --cov-report=term-missing"

[[tool.mypy.overrides]]
module = ["tests.*"]
# Test functions return nothing and omit "-> None" by convention.
disallow_incomplete_defs = false
disallow_untyped_defs = false
